<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plánovač výdajů</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --income: #10b981;
      --expense: #ef4444;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: var(--text);
    }

    /* Karty s přehledem */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .card h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .card.balance p { color: var(--primary); }
    .card.income p { color: var(--income); }
    .card.expense p { color: var(--expense); }

    /* Formulář */
    .form-card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group {
      flex: 1;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input, select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    /* Seznam transakcí */
    .list-card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .transaction-list {
      list-style: none;
    }

    .transaction-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
      background-color: #f9fafb;
      border-left: 4px solid var(--border);
    }

    .transaction-item.income { border-left-color: var(--income); }
    .transaction-item.expense { border-left-color: var(--expense); }

    .info .title {
      font-weight: 600;
      display: block;
    }

    .info .category {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .amount-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .amount {
      font-weight: 700;
    }

    .amount.income { color: var(--income); }
    .amount.expense { color: var(--expense); }

    .delete-btn {
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0 4px;
      width: auto;
    }

    .delete-btn:hover {
      color: var(--expense);
      background: none;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 20px 0;
    }

    @media (max-width: 480px) {
      .overview-grid {
        grid-template-columns: 1fr;
      }
      .form-row {
        flex-direction: column;
        gap: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Plánovač výdajů</h1>

    <!-- Přehled -->
    <div class="overview-grid">
      <div class="card balance">
        <h3>Zůstatek</h3>
        <p id="totalBalance">0 Kč</p>
      </div>
      <div class="card income">
        <h3>Příjmy</h3>
        <p id="totalIncome">+0 Kč</p>
      </div>
      <div class="card expense">
        <h3>Výdaje</h3>
        <p id="totalExpense">-0 Kč</p>
      </div>
    </div>

    <!-- Formulář pro přidání -->
    <div class="form-card">
      <form id="transactionForm" onsubmit="addTransaction(event)">
        <div class="form-group">
          <label for="desc">Název transakce</label>
          <input type="text" id="desc" placeholder="např. Výplata, Nákup potravin..." required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="amount">Částka (Kč)</label>
            <input type="number" id="amount" placeholder="0" min="1" step="any" required>
          </div>

          <div class="form-group">
            <label for="type">Typ</label>
            <select id="type">
              <option value="expense">Výdaj</option>
              <option value="income">Příjem</option>
            </select>
          </div>
        </div>

        <button type="submit">Přidat transakci</button>
      </form>
    </div>

    <!-- Seznam transakcí -->
    <div class="list-card">
      <div class="list-header">
        <h3>Historie transakcí</h3>
      </div>
      <ul id="transactionList" class="transaction-list"></ul>
    </div>
  </div>

  <script>
    let transactions = JSON.parse(localStorage.getItem('transactions') || '[]');

    function updateUI() {
      const list = document.getElementById('transactionList');
      list.innerHTML = '';

      let income = 0;
      let expense = 0;

      if (transactions.length === 0) {
        list.innerHTML = '<div class="empty-state">Zatím nebyly přidány žádné transakce.</div>';
      } else {
        transactions.forEach((item, index) => {
          if (item.type === 'income') {
            income += item.amount;
          } else {
            expense += item.amount;
          }

          const li = document.createElement('li');
          li.className = `transaction-item ${item.type}`;
          li.innerHTML = `
            <div class="info">
              <span class="title">${escapeHtml(item.desc)}</span>
            </div>
            <div class="amount-group">
              <span class="amount ${item.type}">
                ${item.type === 'income' ? '+' : '-'}${formatCurrency(item.amount)}
              </span>
              <button class="delete-btn" onclick="deleteTransaction(${index})" title="Smazat">&times;</button>
            </div>
          `;
          list.appendChild(li);
        });
      }

      const balance = income - expense;
      document.getElementById('totalBalance').textContent = formatCurrency(balance);
      document.getElementById('totalIncome').textContent = '+' + formatCurrency(income);
      document.getElementById('totalExpense').textContent = '-' + formatCurrency(expense);
    }

    function addTransaction(e) {
      e.preventDefault();

      const desc = document.getElementById('desc').value.trim();
      const amount = parseFloat(document.getElementById('amount').value);
      const type = document.getElementById('type').value;

      if (!desc || isNaN(amount) || amount <= 0) return;

      transactions.unshift({ desc, amount, type });
      saveAndRefresh();

      document.getElementById('transactionForm').reset();
    }

    function deleteTransaction(index) {
      transactions.splice(index, 1);
      saveAndRefresh();
    }

    function saveAndRefresh() {
      localStorage.setItem('transactions', JSON.stringify(transactions));
      updateUI();
    }

    function formatCurrency(num) {
      return num.toLocaleString('cs-CZ') + ' Kč';
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Inicializace
    updateUI();
  </script>
</body>
</html>
